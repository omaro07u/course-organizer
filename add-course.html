<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Organizer - Add Course</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1> My Course Organizer</h1>
        <p>Your personal planner</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">My Courses</a>
        <a href="add-course.html">Add Course</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <main>
        <section>
            <h2>Add a New Course</h2>
            <form>
                <label for="courseName">Course Name</label>
                <input type="text" id="courseName" placeholder="e.g. Internet Technology">

                <label for="instructor">Instructor</label>
                <input type="text" id="instructor" placeholder="e.g. Dr.Mahmoud">

                <label for="credits">Credit Hours</label>
                <input type="number" id="credits" placeholder="e.g. 3">

                <label for="notes">Notes</label>
                <textarea id="notes" placeholder="Any notes about this course..."></textarea>

                <button type="submit">Add Course</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Omar mohamed</p>
    </footer>

</body>
</html>
